# Runs the bot every hour for free on GitHub Actions.
# Add RAPIDAPI_KEY and DISCORD_WEBHOOK_URL (and/or TELEGRAM_*) in
# Settings -> Secrets and variables -> Actions.
name: Sneaker price alert

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check prices
        run: |
          if [ -z "$RAPIDAPI_KEY" ]; then echo "RAPIDAPI_KEY secret not set - skipping."; exit 0; fi
          node src/bot.js --once
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Keep state.json (resolved products, sent alerts) between runs
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "price-alert-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json && git commit -m "Update alert state" && git push
          fi
